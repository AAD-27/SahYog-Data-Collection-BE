server.port=8091
server.servlet.context-path=/ms-data-collection
spring.application.name=ms-data-collection
spring.datasource.url=jdbc:mysql://localhost:3306/SAHYOG_DB?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:password}
logging.level.root=WARN
logging.level.com.sahyog.datacollection=DEBUG
auth.jwt.secret=${AUTH_JWT_SECRET}
auth.aadhaar.pepper=${AUTH_AADHAAR_PEPPER}
auth.access-token-seconds=${AUTH_ACCESS_TOKEN_SECONDS:3600}
auth.refresh-token-seconds=${AUTH_REFRESH_TOKEN_SECONDS:604800}
